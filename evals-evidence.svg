<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="Noto Sans SC, -apple-system, Segoe UI, sans-serif">
  <rect width="680" height="460" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#1A202C">InsightLoop · Evals 评估看板实测结果</text>
  <text x="40" y="62" font-size="13" fill="#4A5568">v2.2.8 ｜ 100 条固定边界反馈用例 ｜ Mock 基线 vs GLM-4-Flash ｜ 2026-07-28</text>

  <!-- Legend -->
  <g transform="translate(420, 42)">
    <rect x="0" y="-10" width="14" height="14" rx="3" fill="#3B5BDB"/>
    <text x="22" y="2" font-size="12" fill="#2D3748">Mock 确定性基线</text>
    <rect x="130" y="-10" width="14" height="14" rx="3" fill="#0D9488"/>
    <text x="152" y="2" font-size="12" fill="#2D3748">GLM-4-Flash（真实）</text>
  </g>

  <!-- Y gridlines + labels -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="380" x2="630" y2="380"/>
    <line x1="70" y1="307.5" x2="630" y2="307.5"/>
    <line x1="70" y1="235" x2="630" y2="235"/>
    <line x1="70" y1="162.5" x2="630" y2="162.5"/>
    <line x1="70" y1="90" x2="630" y2="90"/>
  </g>
  <g font-size="11" fill="#718096" text-anchor="end">
    <text x="60" y="384">0</text>
    <text x="60" y="311">25</text>
    <text x="60" y="239">50</text>
    <text x="60" y="166">75</text>
    <text x="60" y="94">100</text>
  </g>
  <text x="40" y="240" font-size="11" fill="#718096" text-anchor="middle" transform="rotate(-90 40 240)">指标命中率 (%)</text>

  <!-- Group 1: 格式稳定率 (100% / 100%) -->
  <rect x="125" y="90" width="50" height="290" rx="4" fill="#3B5BDB"/>
  <rect x="185" y="90" width="50" height="290" rx="4" fill="#0D9488"/>
  <text x="150" y="82" font-size="13" font-weight="700" fill="#1A202C" text-anchor="middle">100%</text>
  <text x="210" y="82" font-size="13" font-weight="700" fill="#0D9488" text-anchor="middle">100%</text>

  <!-- Group 2: 任务理解率 (88% / 97%) -->
  <rect x="325" y="124.8" width="50" height="255.2" rx="4" fill="#3B5BDB"/>
  <rect x="385" y="96.9" width="50" height="283.1" rx="4" fill="#0D9488"/>
  <text x="350" y="117" font-size="13" font-weight="700" fill="#1A202C" text-anchor="middle">88%</text>
  <text x="410" y="89" font-size="13" font-weight="700" fill="#0D9488" text-anchor="middle">97%</text>

  <!-- Group 3: 有帮助率 (90% / 97%) -->
  <rect x="525" y="119" width="50" height="261" rx="4" fill="#3B5BDB"/>
  <rect x="585" y="96.9" width="50" height="283.1" rx="4" fill="#0D9488"/>
  <text x="550" y="111" font-size="13" font-weight="700" fill="#1A202C" text-anchor="middle">90%</text>
  <text x="610" y="89" font-size="13" font-weight="700" fill="#0D9488" text-anchor="middle">97%</text>

  <!-- Group labels -->
  <g font-size="13" fill="#2D3748" text-anchor="middle" font-weight="600">
    <text x="180" y="402">格式稳定率</text>
    <text x="380" y="402">任务理解率</text>
    <text x="580" y="402">有帮助率</text>
  </g>

  <!-- Footnote -->
  <rect x="40" y="424" width="600" height="26" rx="6" fill="#F0F4FF"/>
  <text x="52" y="441" font-size="12" fill="#2B4A8B">说明：双轨结果均来自评估看板实测（Mock 经 Node 校验器对拍）。真实模型在正向表扬、英文反馈等边界 case 上显著收敛；表扬+建议混合、重复刷屏、部分中性建议等细语义场景仍有少量 miss，已逐条标注。</text>
</svg>