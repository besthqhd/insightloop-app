<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="Noto Sans SC, -apple-system, Segoe UI, sans-serif">
  <rect width="680" height="460" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#1A202C">InsightLoop · Evals 评估看板实测结果（Mock 确定性基线）</text>
  <text x="40" y="62" font-size="13" fill="#4A5568">v2.2.8 ｜ 100 条固定边界反馈用例 ｜ 经 Node 校验器逐条对拍</text>

  <!-- Y gridlines + labels -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="380" x2="630" y2="380"/>
    <line x1="70" y1="307.5" x2="630" y2="307.5"/>
    <line x1="70" y1="235" x2="630" y2="235"/>
    <line x1="70" y1="162.5" x2="630" y2="162.5"/>
    <line x1="70" y1="90" x2="630" y2="90"/>
  </g>
  <g font-size="11" fill="#718096" text-anchor="end">
    <text x="60" y="384">0</text>
    <text x="60" y="311">25</text>
    <text x="60" y="239">50</text>
    <text x="60" y="166">75</text>
    <text x="60" y="94">100</text>
  </g>
  <text x="40" y="240" font-size="11" fill="#718096" text-anchor="middle" transform="rotate(-90 40 240)">指标命中率 (%)</text>

  <!-- Group 1: 格式稳定率 (100%) -->
  <rect x="140" y="90" width="60" height="290" rx="4" fill="#3B5BDB"/>
  <text x="170" y="82" font-size="14" font-weight="700" fill="#1A202C" text-anchor="middle">100%</text>

  <!-- Group 2: 任务理解率 (88%) -->
  <rect x="310" y="124.8" width="60" height="255.2" rx="4" fill="#3B5BDB"/>
  <text x="340" y="117" font-size="14" font-weight="700" fill="#1A202C" text-anchor="middle">88%</text>

  <!-- Group 3: 有帮助率 (90%) -->
  <rect x="480" y="119" width="60" height="261" rx="4" fill="#3B5BDB"/>
  <text x="510" y="111" font-size="14" font-weight="700" fill="#1A202C" text-anchor="middle">90%</text>

  <!-- Group labels -->
  <g font-size="13" fill="#2D3748" text-anchor="middle" font-weight="600">
    <text x="170" y="402">格式稳定率</text>
    <text x="340" y="402">任务理解率</text>
    <text x="510" y="402">有帮助率</text>
  </g>

  <!-- Footnote -->
  <rect x="40" y="424" width="600" height="26" rx="6" fill="#F0F4FF"/>
  <text x="52" y="441" font-size="12" fill="#2B4A8B">说明：以上为确定性 Mock 基线（100 条用例逐条对拍）。剩余失分项均为单意图来源定位、正向/英文情绪识别等 Mock 中文基线的已知盲区，接入真实模型后显著收敛；真实模型对比待重跑 Evals 看板确认。</text>
</svg>
